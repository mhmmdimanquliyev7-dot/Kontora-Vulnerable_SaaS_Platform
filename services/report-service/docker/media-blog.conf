# Chapter 16 — unrestricted file upload -> RCE lab (INTENTIONAL, training only).
#
# Serves the shared blog_media volume (written by the api's blog cover upload)
# at /media/blog. This is a NEW, self-contained fragment: it does not touch the
# existing DocumentRoot (/var/www/html), the report app, its .htaccess, or the
# 000-default vhost.
#
# The AddHandler line is the deliberate misconfiguration: it maps the PHP
# handler to *any* filename containing a .php extension segment, so an uploaded
# polyglot such as `shell.php.png` (last extension .png, so it passed the
# upload's extension checks) is still executed as PHP when requested here.
Alias /media/blog /var/www/media/blog

<Directory /var/www/media/blog>
    Require all granted
    Options -Indexes -MultiViews
    AddHandler application/x-httpd-php .php
</Directory>
