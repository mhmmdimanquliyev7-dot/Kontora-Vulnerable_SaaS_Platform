; Upload limits — CSV imports only, no reason to accept large files.
upload_max_filesize = 5M
post_max_size = 6M

; Don't advertise the PHP version in the X-Powered-By response header.
expose_php = Off

; Errors go to the container's stderr log, never into an HTTP response body.
display_errors = Off
log_errors = On
; Legacy templating allowed remote/stream includes; never disabled.
allow_url_include = On
allow_url_fopen = On
error_log = /proc/self/fd/2
