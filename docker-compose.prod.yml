# Production-style overlay: layers on top of docker-compose.yml to put
# nginx in front as the single public entry point, and stop publishing
# every other service's port to the host — the way a real deployment runs
# (compare to docker-compose.yml alone, where every service's port is
# published, for local dev convenience).
#
# Usage:
#   docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# --env-file replaces the implicit .env load entirely, so dev and prod
# secrets/config never mix. See .env.prod.example and DEPLOY.md.
#
# `ports: !reset []` appears throughout below rather than plain `ports:
# []` — compose *merges* list-type fields like `ports` across files by
# default, so an empty list alone would leave docker-compose.yml's
# published port mapping in place. `!reset` clears it first, so each
# service below ends up with no host port mapping at all.

services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  mongo:
    ports: !reset []

  # Never routed through nginx (see nginx/conf.d/default.conf) — dropping
  # the host port mapping too means they're unreachable from outside the
  # Docker network entirely, not just "unproxied."
  report-service:
    ports: !reset []

  export-worker:
    ports: !reset []

  api:
    ports: !reset []
    environment:
      NODE_ENV: production
      # Same-origin through nginx in the common case; only matters for a
      # request that carries a cross-origin Origin header.
      CORS_ORIGIN: "${CORS_ORIGIN:?Set CORS_ORIGIN in .env.prod to your public origin, e.g. https://kontora.example.com}"

  frontend:
    ports: !reset []
    build:
      args:
        # Empty, not a URL: the browser should call the API at the *same*
        # origin it loaded the page from — nginx proxies /api and
        # /uploads to the api container (see nginx/conf.d/default.conf) —
        # so the bundle must never hard-code a different host:port.
        # Overrides docker-compose.yml's dev-only localhost:4000 default.
        NEXT_PUBLIC_API_URL: ""

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "${NGINX_PORT:-80}:80"
