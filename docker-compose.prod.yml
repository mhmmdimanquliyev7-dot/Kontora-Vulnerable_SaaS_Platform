# Production-style overlay: layers on top of docker-compose.yml to put
# nginx in front as the single public entry point, and stop publishing
# every other service's port to the host — the way a real deployment runs
# (compare to docker-compose.yml alone, where every service's port is
# published, for local dev convenience).
#
# Usage:
#   docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# --env-file replaces the implicit .env load entirely, so dev and prod
# secrets/config never mix. See .env.prod.example and DEPLOY.md.
#
# `ports: !reset []` appears throughout below rather than plain `ports:
# []` — compose *merges* list-type fields like `ports` across files by
# default, so an empty list alone would leave docker-compose.yml's
# published port mapping in place. `!reset` clears it first, so each
# service below ends up with no host port mapping at all.

services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  mongo:
    ports: !reset []

  # A dev-only mail catcher (see docker-compose.yml) — a real deployment
  # sends through a real provider (below), never through this container, so
  # its web UI has no reason to be reachable from outside the network
  # either.
  mailhog:
    ports: !reset []

  # Never routed through the reverse proxy — dropping the host port mapping
  # too means they're unreachable from outside the Docker network entirely,
  # not just "unproxied."
  report-service:
    ports: !reset []

  export-worker:
    ports: !reset []

  # The mock OAuth provider (Kontora ID). Internal-only in prod for now: this
  # drops its dev host port (9000), and there is deliberately NO reverse-proxy
  # route to it (see the Caddyfile), so browser-based "Sign in with Kontora ID"
  # is intentionally unreachable in prod until a later chapter wires up its
  # public routing. Its own environment and the api's OAuth env vars are
  # unchanged — this override only removes the published port.
  oauth-provider:
    ports: !reset []

  api:
    ports: !reset []
    environment:
      NODE_ENV: production
      # Same-origin through nginx in the common case; only matters for a
      # request that carries a cross-origin Origin header.
      CORS_ORIGIN: "${CORS_ORIGIN:?Set CORS_ORIGIN in .env.prod to your public origin, e.g. https://kontora.example.com}"
      # Overrides docker-compose.yml's dev-only mailhog:1025 default — a
      # real deployment needs an actual SMTP provider for password reset
      # emails to reach anyone. See .env.prod.example and DEPLOY.md.
      SMTP_HOST: "${SMTP_HOST:?Set SMTP_HOST in .env.prod to a real SMTP provider}"
      SMTP_PORT: "${SMTP_PORT:?Set SMTP_PORT in .env.prod (e.g. 587)}"
      MAIL_FROM: "${MAIL_FROM:?Set MAIL_FROM in .env.prod, e.g. \"Kontora <no-reply@kontora.example.com>\"}"

  frontend:
    ports: !reset []
    build:
      args:
        # Empty, not a URL: the browser should call the API at the *same*
        # origin it loaded the page from — nginx proxies /api and
        # /uploads to the api container (see nginx/conf.d/default.conf) —
        # so the bundle must never hard-code a different host:port.
        # Overrides docker-compose.yml's dev-only localhost:4000 default.
        NEXT_PUBLIC_API_URL: ""

  # Caddy is the single public entry point and TLS terminator (DEPLOY.md
  # Option A). It obtains and renews Let's Encrypt certificates automatically —
  # no certbot step or renewal cron — and sets X-Forwarded-Proto correctly by
  # default, so the API's `trust proxy` handling issues Secure cookies with no
  # further changes (see api/src/lib/cookies.ts). Routing (and the IP
  # allowlist) live in ./Caddyfile.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Named volumes persist the issued certificates and Caddy's state so
      # renewals survive a container restart.
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"

# Merged onto docker-compose.yml's top-level volumes. caddy_data holds the
# Let's Encrypt certificates + ACME account; caddy_config holds Caddy's
# autosave config — both must persist so cert renewals aren't lost on restart.
volumes:
  caddy_data:
  caddy_config:
