# Kontora reverse proxy — the single public entry point for the whole
# stack (see docker-compose.prod.yml). report-service (PHP) and
# export-worker (Java) are deliberately NOT routed here: they're
# internal-only, reachable only from the api container over the compose
# network. Nothing in this file changes that — it only ever talks to
# `api` and `frontend`.

# Preserves whatever X-Forwarded-Proto an upstream edge already set (e.g.
# Caddy or another proxy terminating TLS in front of this one — see
# DEPLOY.md), falling back to this connection's own scheme when nginx is
# the first hop. The API's `trust proxy` setting reads this header to
# decide whether to issue Secure cookies, so getting it right here is what
# makes login work at all, both locally over plain HTTP and once real
# HTTPS is added.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Headroom over the API's own 5MB CSV / 2MB logo upload limits (see
# api/src/middleware/upload.ts) — nginx should never be the thing that
# rejects an upload the API itself would accept.
client_max_body_size 6m;

server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    # API — no path component after the upstream in proxy_pass, so the
    # full incoming URI (already /api/...; the API mounts its router at
    # /api, see api/src/app.ts) is forwarded unchanged.
    location /api/ {
        proxy_pass http://api:4000;
    }

    # Static uploads (company logos) — served by the API outside the
    # /api prefix (see api/src/app.ts and company.service.ts).
    location /uploads/ {
        proxy_pass http://api:4000;
    }

    # Everything else: the Next.js frontend.
    location / {
        proxy_pass http://frontend:3000;
    }
}
