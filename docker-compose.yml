name: kontora

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kontora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kontora_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-kontora}
      # Only read by db/init/01-report-service-role.sh, and only on a brand
      # new volume (see that script's own comment for the on-an-existing-
      # volume manual-apply path).
      REPORT_SERVICE_DB_PASSWORD: ${REPORT_SERVICE_DB_PASSWORD:-report_service_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kontora} -d ${POSTGRES_DB:-kontora}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backs exactly one feature (invoice comments — see
  # api/src/models/invoiceComment.model.ts). Postgres remains the system of
  # record for everything else; this isn't a second copy of the same data.
  # Root credentials are used directly by the API here (unlike Postgres,
  # which gets a dedicated least-privilege role for report-service) because
  # the only caller is the API itself — the same trust level it already has
  # over the whole Postgres database via its own Prisma user.
  mongo:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-kontora}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-kontora_dev_password}
      MONGO_INITDB_DATABASE: kontora
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand(\"ping\")'",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # SMTP mail-catcher for dev: the API sends real SMTP messages (password
  # reset emails) here instead of a real provider, and MailHog's web UI
  # (port 8025) lets you read them without any inbox ever existing. Not
  # meant for a real deployment — see DEPLOY.md.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"

  # A plausible "legacy" internal reporting/import tool (PHP) that the main
  # API calls over the Docker network — see services/report-service/. Reads
  # Postgres directly (via the report_readonly role, SELECT-only, provisioned
  # by db/init/01-report-service-role.sh) for its revenue-summary report;
  # CSV import is parse-only here, the API does the actual writing. Never
  # published outside this compose network in a real deployment — the host
  # port below is dev/debugging convenience only, same as Postgres/Redis.
  report-service:
    build:
      context: .
      dockerfile: services/report-service/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://report_readonly:${REPORT_SERVICE_DB_PASSWORD:-report_service_dev_password}@postgres:5432/${POSTGRES_DB:-kontora}
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env (openssl rand -hex 32)}"
    # Chapter 16 — serves the shared blog cover volume at /media/blog (Apache
    # /media/blog fragment + AddHandler .php). Written by the api service below.
    volumes:
      - blog_media:/var/www/media/blog
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${REPORT_SERVICE_PORT:-8090}:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # A Java/Spring Boot service that turns invoice data the API sends it into
  # bulk XML/PDF exports — see services/export-worker/. Stateless (no DB
  # credentials at all); the API is the sole source of the data it renders.
  # Same "internal only in a real deployment" note as report-service above.
  export-worker:
    build:
      context: .
      dockerfile: services/export-worker/Dockerfile
    restart: unless-stopped
    environment:
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env (openssl rand -hex 32)}"
    mem_limit: 384m
    ports:
      - "${EXPORT_WORKER_PORT:-8091}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # "Kontora ID" — a self-contained mock OAuth 2.0 authorization server (see
  # services/oauth-provider/). Unlike report-service/export-worker this one is
  # NOT internal-only: an authorization-code flow redirects the user's actual
  # browser to /authorize, so it must be reachable from the host. The API also
  # talks to it back-channel (/token, /userinfo) over the Docker network —
  # hence the two URLs the api service is given below.
  oauth-provider:
    build:
      context: .
      dockerfile: services/oauth-provider/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 9000
      OAUTH_CLIENT_ID: kontora-app
      OAUTH_CLIENT_SECRET: "${OAUTH_CLIENT_SECRET:?Set OAUTH_CLIENT_SECRET in .env (openssl rand -hex 32)}"
      # Exact-match allowlist. The API's callback is the only registered URI.
      OAUTH_REDIRECT_URIS: "${OAUTH_REDIRECT_URIS:-http://localhost:4000/api/auth/oauth/callback}"
    ports:
      - "${OAUTH_PROVIDER_PORT:-9000}:9000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:9000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      report-service:
        condition: service_healthy
      export-worker:
        condition: service_healthy
      oauth-provider:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-kontora}:${POSTGRES_PASSWORD:-kontora_dev_password}@postgres:5432/${POSTGRES_DB:-kontora}?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:3000
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}"
      ACCESS_TOKEN_TTL_MINUTES: 15
      REFRESH_TOKEN_TTL_DAYS: 30
      LOGIN_TOKEN_TTL_MINUTES: 5
      MONGODB_URL: mongodb://${MONGO_USER:-kontora}:${MONGO_PASSWORD:-kontora_dev_password}@mongo:27017/kontora?authSource=admin
      REPORT_SERVICE_URL: http://report-service:80
      EXPORT_WORKER_URL: http://export-worker:8080
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env (openssl rand -hex 32)}"
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      MAIL_FROM: "Kontora <no-reply@kontora.test>"
      # Two URLs for the same provider, on purpose: PUBLIC is what the user's
      # browser is redirected to, INTERNAL is the Docker-network address the
      # API uses for the back-channel /token and /userinfo calls.
      OAUTH_ISSUER_PUBLIC_URL: "${OAUTH_ISSUER_PUBLIC_URL:-http://localhost:9000}"
      OAUTH_ISSUER_INTERNAL_URL: http://oauth-provider:9000
      OAUTH_CLIENT_ID: kontora-app
      OAUTH_CLIENT_SECRET: "${OAUTH_CLIENT_SECRET:?Set OAUTH_CLIENT_SECRET in .env (openssl rand -hex 32)}"
      OAUTH_CALLBACK_URL: "${OAUTH_CALLBACK_URL:-http://localhost:4000/api/auth/oauth/callback}"
    volumes:
      - api_uploads:/workspace/api/uploads
      # Private file storage (invoice attachments) — deliberately a separate
      # volume from api_uploads because, unlike uploads, nothing here is served
      # by the static mount; it's only ever read back through the authenticated
      # download controller.
      - api_storage:/workspace/api/storage
      # Chapter 16 — shared blog cover volume: the api WRITES uploaded covers
      # here; the report-service serves the same volume at /media/blog.
      - blog_media:/workspace/api/media/blog
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  # Runs Prisma CLI commands (migrate, db seed, studio) against the "postgres"
  # service over the Docker network, e.g.:
  #   docker compose run --rm migrate migrate dev --name <name>
  #   docker compose run --rm migrate db seed
  # On some machines a locally-installed Postgres, VPN, or security software
  # intercepts host-mapped connections to the Postgres port, causing `prisma
  # migrate`/`db seed` run directly on the host to fail with a password/auth
  # error even though the credentials are correct (see README). Running the
  # Prisma CLI here, inside Docker's network, sidesteps that entirely.
  migrate:
    image: node:25-slim
    working_dir: /workspace/db
    volumes:
      - ./:/workspace
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kontora}:${POSTGRES_PASSWORD:-kontora_dev_password}@postgres:5432/${POSTGRES_DB:-kontora}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]
    entrypoint: ["npx", "prisma"]
    # Only bound when invoked with `docker compose run --service-ports`, e.g.
    # for `prisma studio`; a no-op for plain `migrate`/`db seed` runs.
    ports:
      - "5555:5555"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  postgres_data:
  redis_data:
  mongo_data:
  api_uploads:
  api_storage:
  # Chapter 16 — shared between api (writes blog covers) and report-service
  # (serves them at /media/blog with a PHP handler).
  blog_media:
